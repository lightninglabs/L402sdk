name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace --exclude l402-python --exclude l402-regtest --all-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo doc --workspace --exclude l402-python --exclude l402-wasm --exclude l402-regtest --no-deps

  python:
    name: Python Bindings (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.15']
    defaults:
      run:
        working-directory: crates/l402-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y protobuf-compiler
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip maturin==1.15.0 'pytest>=8.4.2'
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest tests/ -v

  # Keep required check names stable as matrix versions and platforms change.
  python-bindings:
    name: Python Bindings
    needs: python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.python.result }}
        run: test "$MATRIX_RESULT" = success

  go:
    name: Go Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Build FFI static library
        run: cargo build -p l402-ffi --release
      - name: Copy library to Go bindings
        run: |
          mkdir -p bindings/l402-go/lib
          cp target/release/libl402_ffi.a bindings/l402-go/lib/
      - name: Run Go tests
        working-directory: bindings/l402-go
        run: go test -v ./...

  go-bindings:
    name: Go Bindings
    needs: go
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.go.result }}
        run: test "$MATRIX_RESULT" = success

  wasm:
    name: WASM Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack
        run: bash "${{ github.workspace }}/scripts/install-wasm-pack.sh"
      - name: Build WASM (web target)
        run: wasm-pack build crates/l402-wasm --target web
      - name: Run native unit tests
        run: cargo test -p l402-wasm
      - name: Run WASM browser tests
        run: wasm-pack test --headless --chrome crates/l402-wasm

  langchain:
    name: LangChain Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: sudo apt-get install -y protobuf-compiler
      - name: Build Python bindings
        working-directory: crates/l402-python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin==1.15.0 pytest==9.2.0
          .venv/bin/maturin develop
      - name: Install l402-langchain
        working-directory: crates/l402-python
        run: .venv/bin/pip install -e ../../packages/l402-langchain
      - name: Audit Python dependencies
        working-directory: crates/l402-python
        run: |
          .venv/bin/pip install pip-audit==2.10.1
          .venv/bin/pip-audit --skip-editable
      - name: Run LangChain tests
        working-directory: crates/l402-python
        run: .venv/bin/pytest ../../packages/l402-langchain/tests/ -v

  wasm-node-tests:
    name: WASM Node.js Tests
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/l402-wasm/tests/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack
        run: bash "${{ github.workspace }}/scripts/install-wasm-pack.sh"
      - name: Build WASM package
        run: wasm-pack build crates/l402-wasm --target web
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: yarn install --no-immutable
      - run: yarn vitest run
      - run: yarn npm audit --all --recursive

  typescript:
    name: TypeScript (l402-ai-sdk)
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/l402-ai-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack
        run: bash "${{ github.workspace }}/scripts/install-wasm-pack.sh"
      - name: Build WASM package
        run: wasm-pack build crates/l402-wasm --target web
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: yarn install --no-immutable  # WASM pkg is rebuilt each CI run, hash always changes
      - run: yarn tsc --noEmit
      - run: yarn vitest run
      - run: yarn npm audit --all --recursive

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.89.0'
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace --all-features
      - run: cargo check -p l402-lnd -p l402-cln --no-default-features --features rest

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo generate-lockfile
      - run: cargo audit --deny warnings

  fuzz:
    name: Protocol parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-28
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-10-28 fuzz run protocol -- -max_total_time=30 -max_len=4096
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  demos:
    name: Node package (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: demos/l402-explorer
            check: yarn lint && yarn build && node scripts/test-math.mjs
          - directory: demos/comparison
            check: yarn lint && yarn build
          - directory: examples/ai-agent
            check: yarn typecheck
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: yarn install --immutable
      - run: yarn npm audit --all --recursive
      - run: ${{ matrix.check }}

  # ============================================================
  # Release orchestration (main branch only, after all tests pass)
  # ============================================================

  check-npm-releases:
    name: Check NPM version bumps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, doc, wasm, wasm-node-tests, typescript, audit, demos, msrv, fuzz]
    uses: ./.github/workflows/check-npm-releases.yml

  publish-l402-wasm:
    name: Publish l402-wasm
    needs: check-npm-releases
    if: needs.check-npm-releases.outputs.l402_wasm == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-l402-wasm.yml
    secrets: inherit

  publish-l402-ai-sdk:
    name: Publish l402-ai-sdk
    needs: check-npm-releases
    if: needs.check-npm-releases.outputs.l402_ai_sdk == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-l402-ai-sdk.yml
    secrets: inherit

  # --- PyPI releases ---

  check-pypi-releases:
    name: Check PyPI version bumps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, doc, python, langchain, audit, msrv, fuzz]
    uses: ./.github/workflows/check-pypi-releases.yml

  publish-l402-python:
    name: Publish L402sdk (Python)
    needs: check-pypi-releases
    if: needs.check-pypi-releases.outputs.l402_python == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-l402-python.yml
    secrets: inherit

  publish-l402-langchain:
    name: Publish l402-langchain
    needs: check-pypi-releases
    if: needs.check-pypi-releases.outputs.l402_langchain == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-l402-langchain.yml
    secrets: inherit
