name: Publish l402-wasm

on:
  workflow_call:

jobs:
  build:
    name: Build WASM package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack
        run: bash "${{ github.workspace }}/scripts/install-wasm-pack.sh"
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Build WASM (bundler target)
        run: wasm-pack build crates/l402-wasm --scope lightninglabs
      - name: Rename package to @lightninglabs/l402
        working-directory: crates/l402-wasm/pkg
        run: |
          jq '.name = "@lightninglabs/l402"' package.json > temp.json && mv temp.json package.json
          echo "Published package.json:"
          cat package.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/l402-wasm/pkg
          key: l402-wasm-${{ github.sha }}

  dry-run:
    name: Dry-run publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/l402-wasm/pkg
          key: l402-wasm-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Dry-run npm publish
        working-directory: crates/l402-wasm/pkg
        run: npm publish --dry-run

  publish:
    name: Publish to npm
    environment: npm-publish
    runs-on: ubuntu-latest
    needs: dry-run
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/l402-wasm/pkg
          key: l402-wasm-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Publish @lightninglabs/l402
        working-directory: crates/l402-wasm/pkg
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
